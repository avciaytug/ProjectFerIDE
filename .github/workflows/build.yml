# FerIDE: Linux, Windows ve macOS paketlerini bulutta derler.
# GitHub'a gönderildiğinde (veya Actions sekmesinden elle) çalışır; çıktılar "Artifacts" altında indirilir.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            out: build/linux/x64/release/bundle
          - os: windows-latest
            target: windows
            out: build/windows/x64/runner/Release
          - os: macos-latest
            target: macos
            out: build/macos/Build/Products/Release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Linux bağımlılıkları
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: flutter pub get
      - run: flutter test
      - run: flutter build ${{ matrix.target }} --release
      - uses: actions/upload-artifact@v4
        with:
          name: feride-${{ matrix.target }}
          path: ${{ matrix.out }}
