name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux bağımlılıkları
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev
      - run: cargo test -p feride-core
      - run: cargo build -p feride-app
      # Seçilen klasörlere kurulum, veri klasörünün install.json'dan bulunması ve verilerle birlikte kaldırma.
      - name: Kurulum ve kaldırma denemesi
        shell: bash
        run: |
          set -eux
          EXE=feride; if [ "$RUNNER_OS" = Windows ]; then EXE=feride.exe; fi
          BASE="$RUNNER_TEMP"; if command -v cygpath >/dev/null; then BASE="$(cygpath -m "$RUNNER_TEMP")"; fi
          P="$BASE/feride kurulum/Program Dosyaları"; D="$BASE/feride kurulum/Veri Klasörü"
          "target/debug/$EXE" install --yes --dir "$P" --data "$D" --no-shortcuts --no-path --no-launch
          test -f "$P/$EXE"
          test -f "$P/install.json"
          "$P/$EXE" doctor
          test -f "$D/config.toml"
          echo benim > "$D/benim-notum.txt"
          "$P/$EXE" uninstall --yes --purge
          for i in $(seq 1 30); do [ -e "$P/$EXE" ] || break; sleep 1; done
          test ! -e "$P/$EXE"
          test ! -e "$D/config.toml"
          test -f "$D/benim-notum.txt"
