name: Release
on:
  push:
    tags: ['v*']
  # Var olan bir sürümü yeniden derlemek için (Actions > Release > Run workflow)
  workflow_dispatch:
    inputs:
      tag:
        description: 'Yeniden derlenecek etiket (ör. v5.4.0-beta.1)'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: feride-windows-x64.zip
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: feride-linux-x64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: feride-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux bağımlılıkları
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev
      - name: Test
        run: cargo test -p feride-core --target ${{ matrix.target }}
      - name: Derle
        run: cargo build --release -p feride-app --target ${{ matrix.target }}
      - name: Paketle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/feride.exe dist/
          Copy-Item README.md, CHANGELOG.md dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.asset }}
          (Get-FileHash -Algorithm SHA256 ${{ matrix.asset }}).Hash.ToLower() + "  ${{ matrix.asset }}" | Out-File -Encoding ascii -NoNewline ${{ matrix.asset }}.sha256
      - name: Paketle (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/feride README.md CHANGELOG.md dist/
          tar -czf ${{ matrix.asset }} -C dist .
          shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          prerelease: true
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
