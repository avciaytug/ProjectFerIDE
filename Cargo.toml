[workspace]
resolver = "2"
members = ["crates/feride-core", "crates/feride-app"]

[workspace.package]
version = "5.4.0-beta.8"
edition = "2021"
rust-version = "1.89"
authors = ["FerIDE"]
repository = "https://github.com/avciaytug/ProjectFerIDE"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
futures = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"

[profile.dev.package."*"]
opt-level = 1
