name: feride_v5_2
description: "FerIDE Beta v5.3.7 — Autonomous Local AI IDE & Universal File/CAD Studio"
publish_to: 'none'
version: 5.3.7-beta+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Architecture
  flutter_riverpod: ^2.5.1
  
  # Agent Core
  uuid: ^4.4.0
  equatable: ^2.0.5
  
  # Network & Data
  dio: ^5.5.0
  path_provider: ^2.1.3

  # Audio & Voice
  record: ^7.1.1

  # Aegis: Memory, Skills & Subagents
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.0
  yaml: ^3.1.2
  
  # UI & Theming
  flutter_svg: ^2.0.10
  path: ^1.9.1
  http: ^1.6.0
  file_picker: ^13.1.0
  web_socket_channel: ^3.0.3
  # Cross Platform & Settings
  shared_preferences: ^2.2.3
  window_manager: ^0.5.2
  desktop_drop: ^0.8.0
  pasteboard: ^0.5.0
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
