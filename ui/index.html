<!doctype html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FerIDE beta v5.4</title>
  <link rel="stylesheet" href="vendor/cm/codemirror.css">
  <link rel="stylesheet" href="vendor/cm/addon/dialog/dialog.css">
  <link rel="stylesheet" href="vendor/xterm/xterm.css">
  <link rel="stylesheet" href="vendor/hljs/github-dark.min.css" id="hljs-theme">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand"><div class="logo">F</div>FerIDE <small>beta v5.4</small></div>
      <div class="chip" id="ws-chip" title="Çalışma klasörü"></div>
      <div class="spacer"></div>
      <button class="icon-btn" id="theme-btn" title="Tema"></button>
      <button class="icon-btn" id="focus-btn" title="Sohbet odak modu (Ctrl+J)"></button>
    </header>
    <div id="main">
      <nav id="activitybar"></nav>
      <aside id="sidepanel"></aside>
      <div class="resizer-x" data-target="sidepanel" data-dir="1"></div>
      <section id="center">
        <div id="tabs"></div>
        <div id="editor-area"></div>
        <div class="resizer-y" data-target="bottompanel"></div>
        <div id="bottompanel"></div>
      </section>
      <div class="resizer-x" data-target="agentpanel" data-dir="-1"></div>
      <aside id="agentpanel"></aside>
    </div>
    <footer id="statusbar"></footer>
  </div>
  <div id="toasts"></div>
  <noscript>FerIDE arayüzü için JavaScript gerekir.</noscript>
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/hljs/highlight.min.js"></script>
  <script src="vendor/cm/codemirror.js"></script>
  <script src="vendor/cm/addon/mode/simple.js"></script>
  <script src="vendor/cm/addon/mode/overlay.js"></script>
  <script src="vendor/cm/addon/edit/matchbrackets.js"></script>
  <script src="vendor/cm/addon/edit/closebrackets.js"></script>
  <script src="vendor/cm/addon/search/searchcursor.js"></script>
  <script src="vendor/cm/addon/dialog/dialog.js"></script>
  <script src="vendor/cm/addon/search/search.js"></script>
  <script src="vendor/cm/addon/selection/active-line.js"></script>
  <script src="vendor/cm/addon/comment/comment.js"></script>
  <script src="vendor/cm/mode/javascript/javascript.js"></script>
  <script src="vendor/cm/mode/python/python.js"></script>
  <script src="vendor/cm/mode/rust/rust.js"></script>
  <script src="vendor/cm/mode/clike/clike.js"></script>
  <script src="vendor/cm/mode/css/css.js"></script>
  <script src="vendor/cm/mode/xml/xml.js"></script>
  <script src="vendor/cm/mode/htmlmixed/htmlmixed.js"></script>
  <script src="vendor/cm/mode/markdown/markdown.js"></script>
  <script src="vendor/cm/mode/shell/shell.js"></script>
  <script src="vendor/cm/mode/toml/toml.js"></script>
  <script src="vendor/cm/mode/yaml/yaml.js"></script>
  <script src="vendor/cm/mode/sql/sql.js"></script>
  <script src="vendor/cm/mode/go/go.js"></script>
  <script src="vendor/cm/mode/dart/dart.js"></script>
  <script src="vendor/cm/mode/powershell/powershell.js"></script>
  <script src="vendor/xterm/xterm.js"></script>
  <script src="vendor/xterm/addon-fit.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
